<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#05090f">
    <meta name="robots" content="noindex">
    <title>Página não encontrada — Scorpion Bits</title>
    <link rel="icon" href="/assets/favicon.png" type="image/png">
    <link rel="stylesheet" href="/css/style.css?v=9">
    <script>document.documentElement.className += " js";</script>
</head>

<body>
    <div class="backdrop" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
        <defs>
            <symbol id="i-arrow-left" viewBox="0 0 24 24">
                <path d="M19.5 12h-14M11.5 18l-6-6 6-6" />
            </symbol>
        </defs>
    </svg>

    <main id="conteudo" style="display:grid;place-items:center;text-align:center;padding:var(--gutter);min-height:100svh">
        <div class="wrap" style="max-width:520px">
            <img src="/assets/logo-mark.png" width="437" height="535" alt=""
                style="width:min(180px,40vw);margin:0 auto 28px;opacity:.9">

            <span class="tag" style="justify-content:center">Erro 404</span>
            <h1 class="sec-title" style="margin-top:16px">Esse cubo não existe</h1>
            <p class="sec-lead" style="margin:0 auto 30px">
                A página que você procurou saiu do mapa. Deve ter caído fora do
                <em>tilemap</em>.
            </p>

            <a class="btn btn--solid btn--lg" href="/">
                <svg class="icon">
                    <use href="#i-arrow-left" />
                </svg>
                Voltar para a home
            </a>
        </div>
    </main>

    <footer class="site-footer">
        <div class="wrap">
            <div class="footer-bottom" style="border-top:0;padding-top:0">
                <p>© 2026 Scorpion Bits.</p>
                <p><a href="mailto:scorpionbits.contato@gmail.com">scorpionbits.contato@gmail.com</a></p>
            </div>
        </div>
    </footer>
</body>

</html>
